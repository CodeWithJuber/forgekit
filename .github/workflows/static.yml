# Deploys the public site to GitHub Pages: the landing page at the site root and the
# generated live-status page at /status/. Only the assembled _site/ directory is
# published — never the whole repository. Both pages share one design system and are
# gated by `forge uicheck design` (see test/pages.test.js and the uicheck suite).
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, but let in-progress production deploys finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      # A full rerun uploads a new package. A deploy-only retry reuses this build's name.
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      artifact_name: ${{ env.PAGES_ARTIFACT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 22
      - name: Build site
        # build-pages.mjs is node-stdlib-only — no npm ci needed. BUILD_PAGES_LIVE=1
        # refreshes public GitHub counters (best-effort; the build succeeds without it).
        run: |
          BUILD_PAGES_LIVE=1 node scripts/build-pages.mjs
          mkdir -p _site/status
          cp landing/index.html _site/index.html
          cp landing/app.js _site/app.js
          cp -R landing/media _site/media
          cp public/index.html _site/status/index.html
          # Brand assets referenced by absolute URL from both pages (favicon,
          # apple-touch-icon, 1200x630 og card). Served from the Pages root.
          cp docs/assets/og.jpg docs/assets/favicon.svg docs/assets/apple-touch-icon.png _site/
          # Interactive diagrams (/diagrams/): rendered from docs/diagrams/src by the pinned
          # Archify commit; a file whose sha256 differs from its validated receipt is refused.
          node scripts/diagrams.mjs site _site/diagrams
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

  archive:
    name: Archive the deployed site on compute
    needs: [build, deploy]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Verify the compute copy before removing the Pages handoff
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          resource="repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          metadata=$(gh api "$resource")
          digest=$(jq -er --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" --arg run "$GITHUB_RUN_ID" '
            select((.id | tostring) == $id and .name == $name and
                   (.workflow_run.id | tostring) == $run and .expired == false)
            | .digest | select(test("^sha256:[0-9a-f]{64}$"))
          ' <<< "$metadata")
          package="$RUNNER_TEMP/github-pages.zip"
          gh api "$resource/zip" > "$package"
          printf '%s  %s\n' "${digest#sha256:}" "$package" | sha256sum --check --status
          bash scripts/ci/put-artifact.sh pages site "$package"
          gh api --method DELETE "$resource"
