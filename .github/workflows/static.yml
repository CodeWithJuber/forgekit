# Deploys the public site to GitHub Pages: the landing page at the site root and the
# generated live-status page at /status/. Only the assembled _site/ directory is
# published — never the whole repository. Both pages share one design system and are
# gated by `forge uicheck design` (see test/pages.test.js and the uicheck suite).
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress production deploys finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: 22
      - name: Build site
        # build-pages.mjs is node-stdlib-only — no npm ci needed. BUILD_PAGES_LIVE=1
        # refreshes public GitHub counters (best-effort; the build succeeds without it).
        run: |
          BUILD_PAGES_LIVE=1 node scripts/build-pages.mjs
          mkdir -p _site/status
          cp landing/index.html _site/index.html
          cp landing/app.js _site/app.js
          cp -R landing/media _site/media
          cp public/index.html _site/status/index.html
          # Brand assets referenced by absolute URL from both pages (favicon,
          # apple-touch-icon, 1200x630 og card). Served from the Pages root.
          cp docs/assets/og.jpg docs/assets/favicon.svg docs/assets/apple-touch-icon.png _site/
          # Interactive diagrams (/diagrams/): rendered from docs/diagrams/src by the pinned
          # Archify commit; a file whose sha256 differs from its validated receipt is refused.
          node scripts/diagrams.mjs site _site/diagrams
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Archive the published site and verify its retention receipt
        if: github.ref == 'refs/heads/master'
        env:
          FORGE_ARCHIVE_ENDPOINT: ${{ vars.FORGE_ARCHIVE_ENDPOINT }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/published-site.zip"
          (cd _site && zip -q -r "$archive" .)
          unzip -tq "$archive"
          bash scripts/ci/put-artifact.sh pages site "$archive"
