# Tag pushes and bump.yml dispatches release the tagged commit. A manual dispatch
# on master with release_tag can recover an existing tag using the latest workflow.
# npm uses OIDC trusted publishing, with an optional granular NPM_TOKEN fallback.
# See docs/RELEASING.md for the npm-side trust setup; never store an OTP in CI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to recover using this workflow (run on master)"
        required: false
        type: string
        default: ""

# Recovery and ordinary tag runs share the same lock, avoiding a double publish.
concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the release tag
        id: target
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG="$REQUESTED_TAG"
          if [ -n "$TAG" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::Recovery must run on $DEFAULT_BRANCH with release_tag set to an existing v* tag."
              exit 1
            fi
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            echo "::error::Release must target a v* tag, or run on $DEFAULT_BRANCH with release_tag set."
            exit 1
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Invalid release tag: $TAG"; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$TAG"
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # Recovery validates the tagged source, not the branch holding the fixed workflow.
  gate:
    needs: resolve
    uses: ./.github/workflows/reusable-quality-gate.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  release:
    needs: [resolve, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0 # release notes can diff from the last tag
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          # NEVER set registry-url here: setup-node would write an _authToken
          # placeholder into .npmrc and export NODE_AUTH_TOKEN, so npm would
          # authenticate with the placeholder and never run the OIDC handshake —
          # the registry then answers E404 on PUT (provenance still signs fine,
          # which makes this look like a trust misconfiguration). The publish
          # step pins --registry explicitly instead.
          package-manager-cache: false
      # Node 22 bundles npm 10, which cannot exchange GitHub OIDC credentials.
      # Pin the publishing CLI independently; npm 12.2.0 requires Node >=22.22.2.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@12.2.0 --registry=https://registry.npmjs.org
          npm --version
      - run: npm ci
      - name: Assert tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG. Re-run the 'Bump version' workflow instead of tagging by hand."
            exit 1
          fi
      - name: Publish to npm (with provenance)
        env:
          # OIDC trusted publishing ONLY. Do NOT add NODE_AUTH_TOKEN here: when a
          # bearer token is configured, npm authenticates with it and never attempts
          # the OIDC exchange — and npm now rejects 2FA-bypassing tokens for direct
          # publishing (EOTP). The package's trusted publisher (npmjs.com package
          # settings: organization CodeWithJuber, repository forgekit, workflow file
          # release.yml, direct npm publish allowed) is the single publishing
          # credential. See docs/RELEASING.md.
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version --prefer-online >/dev/null 2>&1; then
            echo "::notice::$PKG@$VER is already on npm — skipping publish (idempotent re-run)."
          else
            # Fail fast if anything reintroduces token auth: npm would use the
            # token and never attempt the OIDC exchange (E404 on PUT).
            if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
              echo "::error::NODE_AUTH_TOKEN is set — it would shadow OIDC trusted publishing. Remove it (and registry-url from setup-node)."
              exit 1
            fi
            set +e
            # npm provenance reads source SHA/ref from the process environment.
            # Recovery checks out a tag while the workflow itself runs on master.
            # Keep GITHUB_WORKFLOW_REF intact so the attestation identifies both
            # the actual build workflow and the actual tagged package source.
            # --registry is pinned on the command because setup-node must not set
            # registry-url (see above).
            GITHUB_SHA="$RELEASE_SHA" GITHUB_REF="refs/tags/$TAG" npm publish --provenance --access public --registry=https://registry.npmjs.org 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              if grep -q 'code EOTP' "$RUNNER_TEMP/npm-publish.log"; then
                echo "::error::npm requested an OTP. A bearer token is still being sent (delete the NPM_TOKEN repo secret and any NODE_AUTH_TOKEN in this workflow) or the package's trusted publisher is misconfigured. Required: npmjs.com package settings → Trusted Publisher = GitHub Actions, organization CodeWithJuber, repository forgekit, workflow file release.yml, direct npm publish allowed. Never add an OTP secret or disable account 2FA. See docs/RELEASING.md."
              else
                echo "::error::npm publish failed. Check the registry error above and the npm trusted publisher settings (repository, workflow release.yml, and direct publish permission). See docs/RELEASING.md."
              fi
              exit "$status"
            fi
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG already exists — skipping creation."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
      - name: Verify the release loop closed (fail loudly on a wedge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail=0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG: present."
          else
            echo "::error::No GitHub Release exists for $TAG after the release job."
            fail=1
          fi
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          # Registry packuments can lag publish and cache the pre-publish response.
          ok=0
          for _ in $(seq 1 40); do
            if npm view "$PKG@$VER" version --prefer-online >/dev/null 2>&1; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" = "1" ]; then
            echo "npm $PKG@$VER: present."
          else
            echo "::error::npm does not serve $PKG@$VER after publish (registry wedge?)."
            fail=1
          fi
          if [ "$fail" != "0" ]; then
            echo "::error::Release loop did NOT close for $TAG — do not treat it as shipped. Re-run this workflow to complete the missing artifact."
            exit 1
          fi
          echo "Release loop verified for $TAG."
