# CI gate for every push and PR: the Node 20/22 test matrix (matches the ">=20" engines
# field; 18 is EOL), the research contracts (Python prototype suites + recomputation), plus
# the shared quality gate (Biome, typecheck, ShellCheck, zero-dep assertion, version-drift,
# docs-drift, pack). The quality gate is the SAME reusable workflow
# the version bump and release require, so none of the three can drift from the others.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Windows-git-bash coverage: the guards are bash and the suite does a lot of path work,
  # so run the unit suite on windows-latest under Git Bash. Invoke `node --test` directly
  # (not `npm test`) so Git Bash expands the test glob — npm's Windows script-shell is cmd,
  # which would pass the literal `test/*.test.js`. Genuinely-Unix-only tests (bash guard
  # hooks) self-skip via `process.platform === 'win32'` guards in the tests themselves.
  test-windows:
    name: Test (Windows / Git Bash)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit suite (Git Bash)
        shell: bash
        run: |
          set +e
          node --test --import ./test/_setup.js test/*.test.js 2>&1 | tee /tmp/win-test.log
          ec=${PIPESTATUS[0]}
          echo "===== FAILING TESTS (name + file) ====="
          grep -nE '^not ok ' /tmp/win-test.log | head -80
          echo "===== FAILURE DIAGNOSTICS (TAP YAML blocks) ====="
          # Print each failing test's `not ok` line through its YAML `...` terminator so the
          # assertion detail (expected/actual/location) is visible in the CI log.
          awk '/^not ok /{p=1} p{print} p&&/^  \.\.\.[[:space:]]*$/{p=0}' /tmp/win-test.log | head -200
          exit "$ec"

  # The research contracts (review A02): the two Python prototypes' own suites, the Theorem-D
  # sanity checks (no data needed), and the recomputation of every corrected number from the
  # replication package shipped in this repo. A research claim that stops recomputing fails CI
  # like a broken unit test.
  research:
    name: Research (Python prototypes + recomputation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install prototype test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r research/python-prototypes/impact_oracle/requirements.txt \
            -r research/python-prototypes/router_gate/requirements.txt
      - name: impact_oracle tests
        working-directory: research/python-prototypes/impact_oracle
        run: python -m pytest -q
      - name: router_gate tests
        working-directory: research/python-prototypes/router_gate
        run: python -m pytest -q
      - name: Theorem sanity checks (no data)
        run: python research/recompute_corrections.py --theorem-checks
      - name: Recompute the corrections from the replication package
        run: |
          mkdir -p "$RUNNER_TEMP/rp"
          tar -xzf research/empirical-refutation/replication_package.tar.gz -C "$RUNNER_TEMP/rp"
          python research/recompute_corrections.py "$RUNNER_TEMP/rp/repro"

  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/reusable-quality-gate.yml

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # Advisory: needs the repo's Dependency graph enabled (Settings → Security & analysis).
      # continue-on-error keeps the CHECK green until then — this project has zero runtime deps.
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
