<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- The 1200x630 social card, rendered to og.jpg (2x) by scripts/og-card.mjs. The art
       (og-background.webp: girih lattice and khatam star on the right) leaves x < 610 empty;
       every line of type stays inside it, which the render script checks. -->
  <defs>
    <linearGradient id="og-ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f26430"/>
      <stop offset="100%" stop-color="#f7a072"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#171310"/>
  <image href="og-background.webp" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>

  <!-- wordmark -->
  <g transform="translate(88,92)">
    <rect x="0" y="-4" width="56" height="56" rx="16" fill="url(#og-ember)"/>
    <text x="28" y="35" text-anchor="middle" font-size="31" font-weight="800" fill="#171310">F</text>
    <text x="74" y="37" font-size="38" font-weight="800" fill="#f2ede7" letter-spacing="-1">forge<tspan fill="#f26430">kit</tspan></text>
  </g>

  <text x="90" y="206" font-size="13.5" letter-spacing="5" fill="#f26430" font-weight="700">OPEN SOURCE · BETA · MIT</text>

  <!-- headline -->
  <text x="86" y="276" font-size="54" font-weight="800" fill="#f2ede7" letter-spacing="-2">One operating</text>
  <text x="86" y="336" font-size="54" font-weight="800" fill="#f2ede7" letter-spacing="-2">memory for every</text>
  <text x="86" y="396" font-size="54" font-weight="800" fill="#f26430" letter-spacing="-2">coding agent.</text>

  <!-- subline -->
  <text x="90" y="458" font-size="22" fill="#a99e90">Evidence-referenced memory, change-impact</text>
  <text x="90" y="488" font-size="22" fill="#a99e90">analysis and explicit verification for Claude</text>
  <text x="90" y="518" font-size="22" fill="#a99e90">Code, Codex, Cursor, Gemini and more.</text>

  <!-- footer -->
  <text x="90" y="568" font-size="16" font-weight="600" fill="#a99e90" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">zero runtime dependencies · node ≥ 20</text>
</svg>
