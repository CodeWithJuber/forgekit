# Docs auto-update: after code lands on master, regenerate what the code decides.
#
# `forge docs render` rewrites the machine-owned doc surfaces and the diagram facts: labels
# in docs/diagrams/src bound to the code (the hook chain, tool counts, thresholds — see
# src/diagram_facts.js). A diagram whose source changed is then re-rendered with the pinned
# Archify in headless Chrome (`scripts/diagrams.mjs build --stale`). When anything changed,
# the result goes to ONE branch, docs/auto-update, and ONE open PR, force-pushed on every run
# so it always reflects the newest master; when nothing needs changing, a leftover PR is
# closed. Prose cannot be regenerated: the PR body lists the docs that mention what the merge
# changed (`forge docs impact`) for a person to check.
#
# Like the release PR (docs/RELEASING.md), this PR is opened with GITHUB_TOKEN, and GitHub
# starts no workflow from that token's events: close and reopen it to run CI, then merge.
# Do not push to docs/auto-update by hand; the next run overwrites it.
name: Docs auto-update

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "hooks/**"
      - "global/**"
      - "source/**"
      - "docs/diagrams/**"
      - "scripts/diagrams.mjs"
  workflow_dispatch: {}

concurrency:
  group: docs-autoupdate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the docs/auto-update branch
      pull-requests: write # open, update or close its PR
    env:
      FORGE_NO_HINT: "1"
      BRANCH: docs/auto-update
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # HEAD~1, so `docs impact` can diff what the merge changed

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: List prose that mentions what changed
        run: node src/cli.js docs impact --since HEAD~1 --min-confidence 0.7 > "$RUNNER_TEMP/impact.txt" 2>&1 || true

      - name: Regenerate docs and diagram facts
        run: node src/cli.js docs render

      - name: Re-render diagrams whose source changed
        run: |
          ARCHIFY_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)" \
            node scripts/diagrams.mjs build --stale

      - name: Open, update or close the docs PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN="$(gh pr list --base master --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Docs and diagrams already match the code."
            if [ -n "$OPEN" ]; then
              gh pr close "$OPEN" --comment "master already matches the code; nothing left to update."
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -m "docs: auto-update rendered docs and diagrams" \
            -m "Regenerated from ${GITHUB_SHA::7} by .github/workflows/docs-autoupdate.yml."
          git push --force origin "HEAD:$BRANCH"
          BODY="$RUNNER_TEMP/body.md"
          {
            echo "Regenerated from \`${GITHUB_SHA::7}\` by \`.github/workflows/docs-autoupdate.yml\`: the machine-owned doc surfaces and the diagram labels bound to the code (\`forge docs render\`, \`src/diagram_facts.js\`), then the diagrams whose source changed (\`node scripts/diagrams.mjs build --stale\`)."
            echo
            echo "**Before merging:** close and reopen this PR so CI runs (a PR opened with \`GITHUB_TOKEN\` starts no workflow). Every later push to \`master\` force-pushes this branch again."
            echo
            echo "### Changed"
            echo '```'
            git show --stat --format= HEAD
            echo '```'
            echo
            echo "### Prose to check by hand"
            echo "Prose is not regenerated. These docs mention what the merge changed (\`forge docs impact\`, confidence ≥ 0.7):"
            echo '```'
            head -n 60 "$RUNNER_TEMP/impact.txt"
            echo '```'
          } > "$BODY"
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --body-file "$BODY"
            echo "::notice::Updated docs PR #$OPEN."
          else
            gh pr create --base master --head "$BRANCH" \
              --title "docs: auto-update rendered docs and diagrams" --body-file "$BODY"
          fi
