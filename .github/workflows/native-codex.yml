name: Native Codex hook

on:
  pull_request:
    paths:
      - 'src/**'
      - 'global/**'
      - 'hooks/**'
      - 'data/**'
      - 'scripts/test-native-codex.py'
      - '.github/workflows/native-codex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: 22
      - name: Install pinned Codex CLI
        run: npm install --prefix "$RUNNER_TEMP/forge-native-host" --no-audit --no-fund --ignore-scripts @openai/codex@0.169.0
      - name: Verify first model request against loopback
        run: python3 scripts/test-native-codex.py --codex "$RUNNER_TEMP/forge-native-host/node_modules/.bin/codex"
