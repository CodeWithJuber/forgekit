name: Dashboard browser acceptance
on:
  pull_request:
    paths:
      - 'src/dash*'
      - 'src/report.js'
      - 'src/harness*.js'
      - 'src/cli.js'
      - 'scripts/dashboard-preview.mjs'
      - 'scripts/og-card.mjs'
      - 'scripts/docs-media/**'
      - '.github/workflows/docs-autoupdate.yml'
      - '.github/workflows/dashboard-browser.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 22.14.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare the documentation renderer
        run: |
          scripts/docs-media/setup.sh "$RUNNER_TEMP/docs-render"
          cat "$RUNNER_TEMP/docs-render/env" >> "$GITHUB_ENV"
      - name: Check the social card with the pinned browser
        run: node scripts/og-card.mjs --check
      - name: Check desktop and mobile against the running dashboard
        run: node scripts/dashboard-preview.mjs --check
