name: Native Codex hook

on:
  pull_request:
    paths:
      - 'src/**'
      - 'global/**'
      - 'hooks/**'
      - 'data/**'
      - 'scripts/test-native-codex.py'
      - '.github/workflows/native-codex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned Codex CLI
        run: npm install --prefix "$RUNNER_TEMP/forge-native-host" --no-audit --no-fund --ignore-scripts @openai/codex@0.169.0
      - name: Verify first model request against loopback
        run: python3 scripts/test-native-codex.py --codex "$RUNNER_TEMP/forge-native-host/node_modules/.bin/codex"
