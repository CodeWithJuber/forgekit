# The single quality gate required before merge, tag, AND npm publish (P0-11). CI, the
# version bump, and the release all call this reusable workflow, so a release can no longer
# ship on `npm test` alone while lint/typecheck/shellcheck/docs/pack quietly fail — every
# path runs the exact same checks from one source of truth.
name: Quality gate

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to validate (defaults to the caller's ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gate:
    name: Full quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # the docs CHANGELOG check compares src vs CHANGELOG.md commit times
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: 22
      - run: npm ci
      - name: Check cold and warm Claude web startup
        shell: bash
        run: |
          set -euo pipefail
          project=$(mktemp -d "$RUNNER_TEMP/forge-session.XXXXXX")
          cp package.json package-lock.json .npmrc "$project/"
          cmp package-lock.json "$project/package-lock.json"
          CLAUDE_CODE_REMOTE=true CLAUDE_PROJECT_DIR="$project" bash .claude/hooks/session-start.sh
          touch "$project/node_modules/.forge-ci-warm-check"
          CLAUDE_CODE_REMOTE=true CLAUDE_PROJECT_DIR="$project" bash .claude/hooks/session-start.sh
          test -e "$project/node_modules/.forge-ci-warm-check"
          cmp package-lock.json "$project/package-lock.json"
      - run: npm test
      - run: npm run check
      - run: npm run typecheck
      - run: npm audit --audit-level=critical
      - name: ShellCheck
        run: shellcheck --severity=error $(git ls-files '*.sh')
      - name: Assert zero runtime dependencies
        run: node -e "process.exit(Object.keys(require('./package.json').dependencies||{}).length)"
      - run: node scripts/bump.mjs check
      - run: node src/cli.js docs check
      - name: Claim registry and research copies are current
        run: node scripts/claims-status.mjs --check
      - name: Diagram sources match their verified renders
        run: node scripts/diagrams.mjs check
  consumer:
    name: Packed CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: 22
      - run: node scripts/ci/packed-smoke.mjs
