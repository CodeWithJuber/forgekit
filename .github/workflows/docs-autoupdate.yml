# Regenerate tracked documentation from the merged tree. Each run owns one
# proposal branch. Release notes, brand changes, new tests and documentation
# edits can all affect generated output, so every push to master is checked.
name: Docs auto-update

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: docs-autoupdate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    env:
      FORGE_NO_HINT: "1"
      BRANCH: docs/auto-update
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      - name: Identify generated Markdown and source changes
        run: |
          node src/cli.js docs render --json > "$RUNNER_TEMP/render.json"
          node --input-type=module - <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          import { mediaPlan } from "./scripts/docs-media.mjs";
          import { readManifest, staleDiagrams } from "./scripts/diagrams.mjs";
          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/render.json", "utf8"));
          if (report.diagramFacts.errors.length) throw Error(JSON.stringify(report.diagramFacts.errors));
          const groups = mediaPlan().stale;
          console.log("tools=" + (groups.some(g => g !== "hero") || staleDiagrams(".", readManifest(".")).length > 0));
          JS
        id: plan

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.tools == 'true'
        with:
          python-version: '3.12.10'

      - name: Prepare pinned image and browser tools
        if: steps.plan.outputs.tools == 'true'
        run: |
          scripts/docs-media/setup.sh "$RUNNER_TEMP/docs-render"
          cat "$RUNNER_TEMP/docs-render/env" >> "$GITHUB_ENV"

      - name: Render impacted diagrams, demos and previews
        run: |
          node scripts/diagrams.mjs build --stale
          node scripts/diagrams.mjs sync
          node scripts/docs-media.mjs build
          node scripts/docs-media.mjs check
          node scripts/diagrams.mjs check
          node src/cli.js docs render --check
          node src/cli.js docs check

      - name: Report handwritten guides to review
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git rev-parse --verify --quiet "${BEFORE:-HEAD^}^{commit}" > /dev/null; then
            BEFORE=HEAD^
          fi
          node src/cli.js docs impact --since "${BEFORE:-HEAD^}" --min-confidence 0.7 > "$RUNNER_TEMP/impact.txt"
          {
            echo '### Handwritten guides affected by this change'
            echo
            echo 'Check the listed files and lines against the changed CLI, tool or setting.'
            echo
            echo '````'
            head -n 120 "$RUNNER_TEMP/impact.txt"
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified generated updates
        env:
          GH_TOKEN: ${{ secrets.FORGE_DOCS_TOKEN || github.token }}
        run: |
          gh auth setup-git
          # A rerun of an older successful build must not update a newer proposal.
          refs=$(git ls-remote origin refs/heads/master "refs/heads/$BRANCH")
          master=$(awk '$2 == "refs/heads/master" {print $1}' <<< "$refs")
          expected=$(awk -v branch="refs/heads/$BRANCH" '$2 == branch {print $1}' <<< "$refs")
          if [[ "$master" != "$GITHUB_SHA" ]]; then
            echo "::notice::master advanced; skipping this superseded run."
            exit 0
          fi
          OPEN="$(gh pr list --base master --head "$BRANCH" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')"
          # Stage exactly the Markdown and source fields that the first renderer reported.
          # Diagram exports and media files have explicit output directories or filenames.
          node --input-type=module - <<'JS' > "$RUNNER_TEMP/allowed"
          import {readFileSync} from "node:fs";
          import {readManifest, svgPath, mintlifySvgPath} from "./scripts/diagrams.mjs";
          const r = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/render.json", "utf8"));
          const out = new Set([...r.files.filter(x => x.changed).map(x => x.file), ...r.diagramFacts.drift.map(x => x.file)]);
          for (const d of readManifest(".").diagrams) out.add(svgPath(d)).add(mintlifySvgPath(d));
          out.add("docs/diagrams/diagrams.json");
          for (const file of out) console.log(file);
          JS
          node scripts/docs-media.mjs outputs >> "$RUNNER_TEMP/allowed"
          # sync may remove an obsolete, previously committed site copy.
          git ls-files 'mintlify/images/diagrams/*.svg' >> "$RUNNER_TEMP/allowed"
          while IFS= read -r file; do
            if [[ -e "$file" ]] || git ls-files --error-unmatch -- "$file" >/dev/null 2>&1; then
              git --literal-pathspecs add -A -- "$file"
            fi
          done < "$RUNNER_TEMP/allowed"
          if ! git diff --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            echo "::error::The renderer changed a file outside the documentation outputs."
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            if [[ -n "$OPEN" ]]; then
              gh pr close "$OPEN"
            fi
            echo "::notice::Docs and diagrams match master."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -s -m "docs: refresh generated documentation" \
            -m "Regenerated from $GITHUB_SHA by docs-autoupdate.yml."
          git push --force-with-lease="refs/heads/$BRANCH:$expected" origin "HEAD:refs/heads/$BRANCH"
          BODY="$RUNNER_TEMP/body.md"
          {
            echo "Regenerated from \`$GITHUB_SHA\` using the docs, diagram and media renderers."
            echo
            echo "Review the latest head and select **Approve workflows to run** in the merge box if GitHub requests approval. [GitHub Actions behavior](https://docs.github.com/en/actions/concepts/security/github_token)"
            echo
            echo "### Changed files"
            echo
            echo '```'
            git show --stat --format= HEAD
            echo '```'
            echo
            echo "### Related prose to review"
            echo
            echo '```'
            head -n 60 "$RUNNER_TEMP/impact.txt"
            echo '```'
          } > "$BODY"
          if [[ -n "$OPEN" ]]; then
            gh pr edit "$OPEN" --body-file "$BODY"
          else
            OPEN=$(gh pr create --base master --head "$BRANCH" \
              --title "docs: refresh generated documentation" --body-file "$BODY")
          fi
          # Mint a normal auto-merge request for our verified commit. Review requirements
          # and protected branch checks still apply. No admin/bypass or direct master push.
          head=$(git rev-parse HEAD)
          if ! gh pr merge "$OPEN" --auto --merge --match-head-commit "$head"; then
            echo "::warning::Automatic merge was unavailable. Check the repository auto-merge setting, required checks and review requests on $OPEN."
            echo "Automatic merge was unavailable for $OPEN. Review the repository settings and checks on this proposal." >> "$GITHUB_STEP_SUMMARY"
          fi
